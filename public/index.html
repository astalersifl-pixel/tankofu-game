<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>炭鉱夫 (Tankofu)</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: sans-serif; background-color: #2c2c2c; color: #fff; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    
    .join-screen { position: absolute; inset: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; z-index: 100; }
    .join-screen input { padding: 10px; font-size: 1rem; border-radius: 5px; border: none; text-align: center; }
    .join-screen button { padding: 10px 20px; font-size: 1.1rem; background: #1e90ff; color: #fff; border: none; border-radius: 5px; cursor: pointer; }

    /* --- 対戦相手エリア（余白カット） --- */
    .opponents-area {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #1a1a1a;
      padding: 6px;
      border-bottom: 2px solid #444;
      max-height: 100px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .opponent-card {
      background: #333;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      width: 100%;
    }
    .opponent-card.active {
      border: 2px solid #ffcc00;
      background: #443a1a;
    }
    
    /* --- 中央フィールドエリア（上下余白を極小化） --- */
    .field-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 0;
    }
    
    /* --- 山札エリア --- */
    .decks-container { display: flex; gap: 8px; }
    .deck { width: 55px; height: 70px; border-radius: 5px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; border: 1.5px solid #fff; font-size: 0.65rem; }
    .deck-mine { background: #8b0000; }
    .deck-action { background: #1e90ff; }
    .deck-event { background: #2e8b57; }
    .deck-count { font-size: 0.95rem; margin-top: 2px; }

    .game-log { font-size: 0.75rem; color: #ffcc00; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 8px; max-width: 95%; text-align: center; word-break: break-all; }

    /* --- 自分の手札エリア（余白を削減） --- */
    .my-area { background: #1a1a1a; border-top: 2px solid #444; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
    .cards-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; min-height: 55px; }
    
    .card { min-width: 42px; height: 55px; border-radius: 5px; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; font-size: 0.65rem; border: 1px solid #ccc; cursor: pointer; flex-shrink: 0; }
    .card-score { background: #fff; color: #000; }
    .card-bomb { background: #ff4500; color: #fff; border: 2px solid #ffd700; }
    .card-event { background: #2e8b57; color: #fff; }

    .btn { padding: 10px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; color: #fff; background: #1e90ff; cursor: pointer; width: 100%; }
    .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- 入室・待機画面 -->
  <div id="joinScreen" class="join-screen">
    <h2>炭鉱夫 Online</h2>
    <input type="text" id="playerNameInput" placeholder="プレイヤー名を入力" />
    <button id="joinBtn">ゲームに参加</button>
    <button id="startBtn" style="display:none; background: #2e8b57;">ゲームを開始する (3名以上)</button>
  </div>

  <!-- 対戦画面 (縦スクロール可能) -->
  <div class="opponents-area" id="opponentsArea"></div>

  <div class="field-area">
    <div class="game-log" id="logBox">ゲーム開始を待っています...</div>
    <div class="decks-container">
      <div class="deck deck-mine">鉱山<span class="deck-count" id="mineCount">21</span></div>
      <div class="deck deck-action">行動<span class="deck-count" id="actionCount">20</span></div>
      <div class="deck deck-event">イベント<span class="deck-count" id="eventCount">12</span></div>
    </div>
  </div>

  <div class="my-area">
    <div style="font-size: 0.7rem; color: #888;">自分の得点カード（自分のみ公開）</div>
    <div class="cards-scroll" id="myScoreCards"></div>

    <div style="font-size: 0.7rem; color: #888;">所持イベント（タップで使用）</div>
    <div class="cards-scroll" id="myEventCards"></div>

    <button class="btn" id="drawBtn" disabled>行動山札から1枚引く</button>
  </div>

  <script>
    const socket = io();

    const joinScreen = document.getElementById('joinScreen');
    const playerNameInput = document.getElementById('playerNameInput');
    const joinBtn = document.getElementById('joinBtn');
    const startBtn = document.getElementById('startBtn');
    const drawBtn = document.getElementById('drawBtn');

    joinBtn.addEventListener('click', () => {
      const name = playerNameInput.value.trim();
      if (name) {
        socket.emit('join_game', name);
        joinBtn.style.display = 'none';
        playerNameInput.style.display = 'none';
        startBtn.style.display = 'block';
      }
    });

    startBtn.addEventListener('click', () => {
      socket.emit('start_game');
    });

    drawBtn.addEventListener('click', () => {
      socket.emit('draw_action_deck');
    });

    socket.on('state_update', (state) => {
      if (state.isGameStarted) {
        joinScreen.style.display = 'none';
      }

      // 山札枚数
      document.getElementById('mineCount').innerText = state.deckCounts.mine;
      document.getElementById('actionCount').innerText = state.deckCounts.action;
      document.getElementById('eventCount').innerText = state.deckCounts.event;

      // ログ
      if (state.logs.length > 0) {
        document.getElementById('logBox').innerText = state.logs[state.logs.length - 1];
      }

      // 他プレイヤー状況
      const oppArea = document.getElementById('opponentsArea');
      oppArea.innerHTML = '';
      state.opponents.forEach(opp => {
        const div = document.createElement('div');
        div.className = `opponent-card ${opp.isCurrentTurn ? 'active' : ''}`;
        div.innerHTML = `
          <div style="font-weight:bold; overflow:hidden; text-overflow:ellipsis; max-width:120px; white-space:nowrap;">
            ${opp.name} ${opp.isCurrentTurn ? '◀ ターン' : ''}
          </div>
          <div style="font-size:0.75rem; color:#ccc;">
            得点: <span style="color:#ffcc00; font-weight:bold;">${opp.scoreCardCount}</span>枚 / 
            EV: <span style="color:#2e8b57; font-weight:bold;">${opp.eventCardCount}</span>枚
          </div>
        `;
        oppArea.appendChild(div);
      });

      // 自分の得点カード
      const scoreBox = document.getElementById('myScoreCards');
      scoreBox.innerHTML = '';
      state.myHand.scoreCards.forEach(c => {
        const card = document.createElement('div');
        card.className = `card ${c.type === 'bomb' ? 'card-bomb' : 'card-score'}`;
        card.innerText = c.value + (c.type === 'score' ? '点' : '');
        scoreBox.appendChild(card);
      });

      // 自分のイベントカード
      const eventBox = document.getElementById('myEventCards');
      eventBox.innerHTML = '';
      state.myHand.eventCards.forEach((c, idx) => {
        const card = document.createElement('div');
        card.className = 'card card-event';
        card.innerText = c.name;
        if (state.isMyTurn) {
          card.onclick = () => socket.emit('use_event', idx);
        } else {
          card.style.opacity = '0.6';
        }
        eventBox.appendChild(card);
      });

      // ターン制御ボタン
      drawBtn.disabled = !state.isMyTurn;
    });

    socket.on('show_mine_cards', (mineCards) => {
      alert('【調査結果】鉱山の中身:\n' + mineCards.join(', '));
    });

    socket.on('error_message', (msg) => alert(msg));
  </script>
</body>
</html>
